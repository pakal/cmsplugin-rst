# Requires tox>=4 (tox-uv is recommended for speed: "pip install tox tox-uv")
[tox]
requires = tox>=4
envlist =
    py{310,311,312}-cms311-dj42
    py{310,311,312}-cms41-dj42
    py{310,311,312,313,314}-cms50-dj52
    py{310,311,312,313,314}-cms51-dj52
    py{312,313,314}-cms51-dj{60,61}
    # with djangocms-versioning, which changes the publication workflow of django-cms>=4
    py312-cms41-dj42-versioning
    py313-cms50-dj52-versioning
    py314-cms51-dj61-versioning

[testenv]
description = run the test suite with {basepython}, django-cms and django versions from the env name
extras = test
deps =
    cms311: django-cms~=3.11.0
    cms41: django-cms~=4.1.0
    cms50: django-cms~=5.0.0
    cms51: django-cms~=5.1.0
    dj42: Django~=4.2.0
    dj52: Django~=5.2.0
    dj60: Django~=6.0.0
    dj61: Django~=6.1.0
    versioning: djangocms-versioning
commands = pytest {posargs}
